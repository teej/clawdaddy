[project]
name = "clawdaddy"
version = "0.1.0"
description = "Audio-first agent harness prototype (macOS SwiftUI + Python FastAPI)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "websockets>=12.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false
